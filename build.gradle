plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'ai-assistant'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // LangChain4j BOM - quản lý phiên bản tập trung
    implementation platform('dev.langchain4j:langchain4j-bom:1.10.0')

    // LangChain4j core
    implementation 'dev.langchain4j:langchain4j'

    // Embedding model (chạy local)
    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2'

    // Parser đọc PDF (Apache Tika)
    implementation 'dev.langchain4j:langchain4j-document-parser-apache-tika'

    // HTTP client cho LM Studio (BẮT BUỘC)
    implementation 'dev.langchain4j:langchain4j-http-client-jdk'
}

tasks.named('test') {
    useJUnitPlatform()
}
